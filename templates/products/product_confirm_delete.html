{% extends "base.html" %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Delete Product</h2>
    <p style="margin-bottom:1.5rem;">Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:flex; gap:0.75rem;">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'producer_dashboard' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
