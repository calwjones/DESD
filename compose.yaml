# Bristol Regional Food Network - Docker Compose Configuration
# Sprint 2: Advanced containerisation with network isolation and microservices planning

services:
  db:
    image: postgres:15
    container_name: brfn-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: brfn-web
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8089
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8089:8089"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - backend
      - brfn-shared
    depends_on:
      db:
        condition: service_healthy

  ai-quality-service:
    build: ./ai-quality-service
    container_name: brfn-ai-quality
    ports:
      - "8001:8001"
    environment:
      - DESD_API_URL=http://brfn-web:8089/api
      - DESD_SERVICE_USERNAME=${DESD_SERVICE_USERNAME:-admin}
      - DESD_SERVICE_PASSWORD=${DESD_SERVICE_PASSWORD:-demo1234}
    volumes:
      - ./ai-quality-service/models:/app/models
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      - web

  ai-demand-service:
    build: ./ai-demand-service
    container_name: brfn-ai-demand
    ports:
      - "8002:8002"
    environment:
      - DESD_API_URL=http://brfn-web:8089/api
      - DESD_SERVICE_USERNAME=${DESD_SERVICE_USERNAME:-admin}
      - DESD_SERVICE_PASSWORD=${DESD_SERVICE_PASSWORD:-demo1234}
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      - web

networks:
  backend:
    driver: bridge
    name: brfn-backend
  brfn-shared:
    name: brfn-shared

volumes:
  postgres_data:
    name: brfn-postgres-data
  media_data: