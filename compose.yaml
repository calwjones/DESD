# Bristol Regional Food Network - Docker Compose Configuration
# Sprint 2: Advanced containerisation with network isolation and microservices planning

services:
  db:
    image: postgres:15
    container_name: brfn-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: brfn-web
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8089
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8089:8089"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  # Sprint 3 AI Services (planned architecture - not yet implemented)
